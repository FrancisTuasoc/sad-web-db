<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" width="220" height="50">
  <rect width="220" height="50" fill="none" />
  <!-- Burger Icon -->
  <g transform="translate(4, 2)">
    <!-- Top bun -->
    <path d="M 6 22 A 20 18 0 0 1 46 22 Z" fill="#FDFBF7" />
    <!-- Sesame seeds -->
    <circle cx="18" cy="14" r="1.3" fill="#000000" />
    <circle cx="26" cy="11" r="1.3" fill="#000000" />
    <circle cx="34" cy="15" r="1.3" fill="#000000" />
    <!-- Lettuce / Greens -->
    <path d="M 4 24 Q 9 21 14 24 Q 19 27 24 24 Q 29 21 34 24 Q 39 27 44 24 Q 48 21 50 24 L 48 27 L 4 27 Z" fill="#FDFBF7" />
    <!-- Cheese slice triangle -->
    <polygon points="6,32 46,32 43,37 32,38 9,33" fill="#FDFBF7" />
    <!-- Patty -->
    <rect x="5" y="34" width="42" height="7" rx="3.5" fill="#FDFBF7" />
    <!-- Bottom bun -->
    <rect x="7" y="43" width="38" height="6" rx="3" fill="#FDFBF7" />
  </g>
  <!-- Brand Text -->
  <text x="60" y="35" font-family="Montserrat, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="800" font-size="26" fill="#FDFBF7" letter-spacing="0.5">GIGABITE</text>
</svg>
