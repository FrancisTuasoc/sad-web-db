<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="bunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6B02C" />
      <stop offset="100%" stop-color="#D97A07" />
    </linearGradient>
    <linearGradient id="pattyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#542B1A" />
      <stop offset="100%" stop-color="#2D150B" />
    </linearGradient>
  </defs>
  <!-- Burger Icon -->
  <g transform="translate(6, 4)">
    <!-- Top bun -->
    <path d="M 6 22 A 20 18 0 0 1 46 22 Z" fill="url(#bunGrad)" />
    <!-- Sesame seeds -->
    <circle cx="18" cy="14" r="1.2" fill="#FFF2D6" />
    <circle cx="26" cy="11" r="1.2" fill="#FFF2D6" />
    <circle cx="34" cy="15" r="1.2" fill="#FFF2D6" />
    <!-- Lettuce / Greens -->
    <path d="M 4 24 Q 9 21 14 24 Q 19 27 24 24 Q 29 21 34 24 Q 39 27 44 24 Q 48 21 50 24 L 48 27 L 4 27 Z" fill="#48BB78" />
    <!-- Tomato -->
    <rect x="7" y="27" width="38" height="4" rx="2" fill="#E53E3E" />
    <!-- Cheese slice triangle -->
    <polygon points="6,32 46,32 43,37 32,38 9,33" fill="#ECC94B" />
    <!-- Patty -->
    <rect x="5" y="34" width="42" height="7" rx="3.5" fill="url(#pattyGrad)" />
    <!-- Bottom bun -->
    <rect x="7" y="43" width="38" height="6" rx="3" fill="url(#bunGrad)" />
  </g>
  <!-- Brand Text -->
  <text x="64" y="29" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="18" fill="#FBF8F3" letter-spacing="1">CASESTUDY<tspan fill="#F2A413">-SYSTEM</tspan></text>
  <text x="65" y="45" font-family="'Open Sans', sans-serif" font-weight="600" font-size="9" fill="#E9E2D6" letter-spacing="2">ORDERING &amp; BILLING</text>
</svg>
