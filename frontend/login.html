<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - GIGABITE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/impeccable.css" />
    <script
      src="https://kit.fontawesome.com/32d4994703.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="auth-page">
    <main class="auth-main auth-main--login">
      <div class="modal-card auth-panel auth-panel--login">
        <div class="auth-heading">
          <h2>Welcome Back</h2>
          <p class="text-muted">
            Sign in to your GIGABITE account to order
          </p>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="login-email"
              >Email Address</label
            >
            <input
              type="email"
              id="login-email"
              class="form-input"
              required
              placeholder="Enter your email address"
              autocomplete="email"
              autofocus
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password"
              >Password</label
            >
            <div class="password-field-wrapper">
              <input
                type="password"
                id="login-password"
                class="form-input"
                required
                placeholder="Enter your password"
                autocomplete="current-password"
              />
              <button
                type="button"
                class="toggle-password-btn"
                data-target="login-password"
                aria-label="Toggle password visibility"
              >
                <i class="fa-solid fa-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="auth-reset-link">
            <a href="forgot-password.html">Forgot password?</a>
          </div>

          <button
            type="submit"
            id="login-submit-btn"
            class="btn btn-primary btn-lg"
          >
            Sign In
          </button>
        </form>

        <div class="auth-switch">
          Don't have an account?
          <a href="register.html">Sign Up</a>
        </div>
        <div class="auth-home-link">
          <a href="index.html">← Go back to Home</a>
        </div>
      </div>
    </main>

    <script type="module">
      import { apiFetch } from './js/api.js';
      import { setToken, setUser, isLoggedIn, isAdmin } from './js/auth.js';
      import { showToast } from './js/ui.js';

      function init() {
        // Check if session was expired
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('expired') === '1') {
          showToast('Your session has expired. Please sign in again.', 'info');
        }
        if (urlParams.get('verified') === '1') {
          showToast('Email verified. You can now sign in.', 'success');
        }

        // Password eye toggle
        document.querySelectorAll('.toggle-password-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const target = document.getElementById(
              btn.getAttribute('data-target')
            );
            if (target) {
              target.type = target.type === 'password' ? 'text' : 'password';
            }
          });
        });

        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('login-submit-btn');

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          submitBtn.disabled = true;
          submitBtn.textContent = 'Signing in...';

          const email = document.getElementById('login-email').value.trim();
          const password = document.getElementById('login-password').value;
          const controller = new AbortController();
          const timeout = window.setTimeout(() => controller.abort(), 15000);

          try {
            const res = await apiFetch('/auth/login', {
              method: 'POST',
              body: JSON.stringify({ email, password }),
              signal: controller.signal,
            });

            setToken(res.token);
            setUser(res.user);

            showToast('Sign in successful! Redirecting...', 'success');

            // Role-based redirection
            setTimeout(() => {
              if (res.user.role === 'admin') {
                window.location.href = 'admin.html';
              } else {
                const requestedRedirect = urlParams.get('redirect');
                let redirect = 'index.html';
                if (requestedRedirect) {
                  try {
                    const destination = new URL(
                      requestedRedirect,
                      window.location.href
                    );
                    if (destination.origin === window.location.origin) {
                      redirect = `${destination.pathname}${destination.search}${destination.hash}`;
                    }
                  } catch (err) {
                    // Keep the safe default for malformed redirect values.
                  }
                }
                window.location.href = redirect;
              }
            }, 600);
          } catch (err) {
            showToast(
              controller.signal.aborted
                ? 'Sign in request timed out. Check your connection and try again.'
                : err.message,
              'error'
            );
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
          } finally {
            window.clearTimeout(timeout);
          }
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    </script>
  </body>
</html>
