<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer &amp; Admin Login - casestudy-system</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body class="auth-page">
    <!-- Header with static markup fallback -->
    <header id="site-header" class="site-header">
      <div class="container header-container">
        <a
          href="index.html"
          class="brand-logo"
          aria-label="casestudy-system Home"
        >
          <img
            src="assets/logo.svg"
            alt="casestudy-system Logo"
            onerror="
              this.onerror = null;
              this.src =
                'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 200 40\' width=\'200\' height=\'40\'%3E%3Ctext x=\'10\' y=\'26\' font-family=\'sans-serif\' font-size=\'18\' font-weight=\'bold\' fill=\'%23F2A413\'%3EBURGER%3Ctspan fill=\'%23FFFFFF\'%3ESHOP%3C/tspan%3E%3C/text%3E%3C/svg%3E';
            "
          />
        </a>

        <nav aria-label="Main Navigation">
          <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="index.html#featured">Featured</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#contact">Contact</a></li>
          </ul>
        </nav>

        <div class="header-actions">
          <a
            href="cart.html"
            id="header-cart-btn"
            class="cart-btn"
            aria-label="View Shopping Cart"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path
                d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
              ></path>
            </svg>
            <span id="header-cart-badge" class="cart-badge hidden">0</span>
          </a>

          <div id="header-user-slot">
            <a href="register.html" class="btn btn-secondary btn-sm"
              >Register</a
            >
          </div>

          <button
            id="mobile-nav-btn"
            class="mobile-nav-toggle"
            aria-label="Toggle mobile menu"
          >
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
        </div>
      </div>

      <div id="mobile-drawer-menu" class="mobile-drawer">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="index.html#featured">Featured Burgers</a>
        <a href="index.html#about">About Us</a>
        <a href="index.html#contact">Contact & Store Hours</a>
        <a href="cart.html">My Cart</a>
        <a
          href="register.html"
          style="color: var(--color-accent); font-weight: 700"
          >Register</a
        >
      </div>
    </header>

    <main
      style="
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
        flex: 1;
      "
    >
      <div
        class="modal-card"
        style="
          max-width: 420px;
          width: 100%;
          border-radius: var(--radius-lg);
          padding: 28px;
          box-shadow: var(--shadow-md);
        "
      >
        <div style="text-align: center; margin-bottom: 24px">
          <h2
            style="
              font-size: 1.6rem;
              color: var(--color-brand);
              margin-bottom: 6px;
            "
          >
            Welcome Back
          </h2>
          <p class="text-muted" style="font-size: 0.9rem">
            Sign in to your casestudy-system account to order
          </p>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="login-email"
              >Email Address <span class="req">*</span></label
            >
            <input
              type="email"
              id="login-email"
              class="form-input"
              required
              placeholder="Enter your email address"
              autofocus
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password"
              >Password <span class="req">*</span></label
            >
            <div class="password-field-wrapper">
              <input
                type="password"
                id="login-password"
                class="form-input"
                required
                placeholder="Enter your password"
              />
              <button
                type="button"
                class="toggle-password-btn"
                data-target="login-password"
                aria-label="Toggle password visibility"
              >
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <button
            type="submit"
            id="login-submit-btn"
            class="btn btn-primary btn-lg"
            style="width: 100%; margin-top: 8px"
          >
            Log In
          </button>
        </form>

        <div
          style="
            text-align: center;
            margin-top: 20px;
            font-size: 0.88rem;
            color: var(--color-text-muted);
          "
        >
          Don't have an account?
          <a
            href="register.html"
            style="color: var(--color-brand-secondary); font-weight: 700"
            >Create one now</a
          >
        </div>
      </div>
    </main>

    <footer id="site-footer" class="site-footer">
      <div class="container">
        <div class="footer-bottom" style="border: none; padding: 16px 0">
          &copy; 2026 casestudy-system. All rights reserved.
        </div>
      </div>
    </footer>

    <script type="module">
      import { apiFetch } from './js/api.js';
      import { setToken, setUser, isLoggedIn, isAdmin } from './js/auth.js';
      import { renderHeader, renderFooter, showToast } from './js/ui.js';

      function init() {
        renderHeader('login');
        renderFooter();

        // Check if session was expired
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('expired') === '1') {
          showToast('Your session has expired. Please log in again.', 'info');
        }

        // Password eye toggle
        document.querySelectorAll('.toggle-password-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const target = document.getElementById(
              btn.getAttribute('data-target')
            );
            if (target) {
              target.type = target.type === 'password' ? 'text' : 'password';
            }
          });
        });

        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('login-submit-btn');

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          submitBtn.disabled = true;
          submitBtn.textContent = 'Logging in...';

          const email = document.getElementById('login-email').value.trim();
          const password = document.getElementById('login-password').value;
          const controller = new AbortController();
          const timeout = window.setTimeout(() => controller.abort(), 15000);

          try {
            const res = await apiFetch('/auth/login', {
              method: 'POST',
              body: JSON.stringify({ email, password }),
              signal: controller.signal,
            });

            setToken(res.token);
            setUser(res.user);

            showToast('Login successful! Redirecting...', 'success');

            // Role-based redirection
            setTimeout(() => {
              if (res.user.role === 'admin') {
                window.location.href = 'admin.html';
              } else {
                const requestedRedirect = urlParams.get('redirect');
                let redirect = 'index.html';
                if (requestedRedirect) {
                  try {
                    const destination = new URL(
                      requestedRedirect,
                      window.location.href
                    );
                    if (destination.origin === window.location.origin) {
                      redirect = `${destination.pathname}${destination.search}${destination.hash}`;
                    }
                  } catch (err) {
                    // Keep the safe default for malformed redirect values.
                  }
                }
                window.location.href = redirect;
              }
            }, 600);
          } catch (err) {
            showToast(
              controller.signal.aborted
                ? 'Login request timed out. Check your connection and try again.'
                : err.message,
              'error'
            );
            submitBtn.disabled = false;
            submitBtn.textContent = 'Log In';
          } finally {
            window.clearTimeout(timeout);
          }
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    </script>
  </body>
</html>
