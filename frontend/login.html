<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sign In - GIGABITE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/impeccable.css" />
    <script
      src="https://kit.fontawesome.com/32d4994703.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="auth-page auth-split-body">
    <div class="auth-split-wrapper">
      <!-- Left Panel: Brand Showcase with Burger Image -->
      <aside class="auth-brand-panel">
        <div class="auth-brand-top">
          <a href="index.html" class="auth-brand-logo-link" aria-label="GIGABITE Home">
            <img src="assets/logo-white.svg" alt="GIGABITE" class="auth-brand-logo-img" />
          </a>
        </div>

        <div class="auth-brand-middle">
          <span class="auth-brand-eyebrow">FRESH OFF THE GRILL</span>
          <h1 class="auth-brand-heading">Your next favorite bite<br />starts here.</h1>
          <p class="auth-brand-description">Sign in for juicy burgers, fresh flavors, and easy ordering.</p>
          <div class="auth-brand-rule"></div>
        </div>

        <div class="auth-brand-bottom">
          <p class="auth-brand-tagline">Grilled fresh. Made for you.</p>
        </div>
      </aside>

      <!-- Right Panel: Login Form -->
      <main class="auth-form-panel">
        <div class="auth-form-container">
          <div class="auth-form-header">
            <h2 class="auth-form-title">Welcome Back</h2>
            <p class="auth-form-subtitle">Sign in to your GIGABITE account to order</p>
          </div>

          <form id="login-form" class="auth-form">
            <div class="auth-form-group">
              <label class="auth-form-label" for="login-email">EMAIL ADDRESS</label>
              <input
                type="email"
                id="login-email"
                class="auth-form-input"
                required
                placeholder="Enter your email address"
                autocomplete="email"
                autofocus
              />
            </div>

            <div class="auth-form-group">
              <label class="auth-form-label" for="login-password">PASSWORD</label>
              <div class="auth-password-wrapper">
                <input
                  type="password"
                  id="login-password"
                  class="auth-form-input"
                  required
                  placeholder="Enter your password"
                  autocomplete="current-password"
                />
                <button
                  type="button"
                  class="toggle-password-btn"
                  data-target="login-password"
                  aria-label="Toggle password visibility"
                >
                  <i class="fa-solid fa-eye" aria-hidden="true"></i>
                </button>
              </div>
              <div class="auth-forgot-row">
                <a href="forgot-password.html" class="auth-forgot-link">Forgot password?</a>
              </div>
            </div>

            <button
              type="submit"
              id="login-submit-btn"
              class="auth-submit-button"
            >
              Sign In
            </button>
          </form>

          <div class="auth-divider-line"></div>

          <div class="auth-switch-row">
            Don't have an account?
            <a href="register.html" class="auth-switch-link">Sign Up</a>
          </div>

          <div class="auth-back-row">
            <a href="index.html" class="auth-back-link">← Go back to Home</a>
          </div>
        </div>
      </main>
    </div>

    <script type="module">
      import { apiFetch } from './js/api.js';
      import { setToken, setUser, isLoggedIn, isAdmin } from './js/auth.js';
      import { showToast } from './js/ui.js';

      function init() {
        // Check if session was expired
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('expired') === '1') {
          showToast('Your session has expired. Please sign in again.', 'info');
        }
        if (urlParams.get('verified') === '1') {
          showToast('Email verified. You can now sign in.', 'success');
        }

        // Password eye toggle
        document.querySelectorAll('.toggle-password-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const target = document.getElementById(
              btn.getAttribute('data-target')
            );
            if (target) {
              const isPassword = target.type === 'password';
              target.type = isPassword ? 'text' : 'password';
              const icon = btn.querySelector('i');
              if (icon) {
                if (isPassword) {
                  icon.classList.remove('fa-eye');
                  icon.classList.add('fa-eye-slash');
                } else {
                  icon.classList.remove('fa-eye-slash');
                  icon.classList.add('fa-eye');
                }
              }
            }
          });
        });

        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('login-submit-btn');

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          submitBtn.disabled = true;
          submitBtn.textContent = 'Signing in...';

          const email = document.getElementById('login-email').value.trim();
          const password = document.getElementById('login-password').value;
          const controller = new AbortController();
          const timeout = window.setTimeout(() => controller.abort(), 15000);

          try {
            const res = await apiFetch('/auth/login', {
              method: 'POST',
              body: JSON.stringify({ email, password }),
              signal: controller.signal,
            });

            setToken(res.token);
            setUser(res.user);

            showToast('Sign in successful! Redirecting...', 'success');

            // Role-based redirection
            setTimeout(() => {
              if (res.user.role === 'admin') {
                window.location.href = 'admin.html';
              } else {
                const requestedRedirect = urlParams.get('redirect');
                let redirect = 'index.html';
                if (requestedRedirect) {
                  try {
                    const destination = new URL(
                      requestedRedirect,
                      window.location.href
                    );
                    if (destination.origin === window.location.origin) {
                      redirect = `${destination.pathname}${destination.search}${destination.hash}`;
                    }
                  } catch (err) {
                    // Keep the safe default for malformed redirect values.
                  }
                }
                window.location.href = redirect;
              }
            }, 600);
          } catch (err) {
            showToast(
              controller.signal.aborted
                ? 'Sign in request timed out. Check your connection and try again.'
                : err.message,
              'error'
            );
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
          } finally {
            window.clearTimeout(timeout);
          }
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    </script>
  </body>
</html>
