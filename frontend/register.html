<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sign Up - GIGABITE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/impeccable.css" />
    <script
      src="https://kit.fontawesome.com/32d4994703.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="auth-page auth-split-body">
    <div class="auth-split-wrapper">
      <!-- Left Panel: Brand Showcase with Burger Image -->
      <aside class="auth-brand-panel">
        <div class="auth-brand-top">
          <a href="index.html" class="auth-brand-logo-link" aria-label="GIGABITE Home">
            <img src="assets/logo-white.svg" alt="GIGABITE" class="auth-brand-logo-img" />
          </a>
        </div>

        <div class="auth-brand-middle">
          <span class="auth-brand-eyebrow">FRESH OFF THE GRILL</span>
          <h1 class="auth-brand-heading">Your next favorite bite<br />starts here.</h1>
          <p class="auth-brand-description">Sign up for juicy burgers, fresh flavors, and easy ordering.</p>
          <div class="auth-brand-rule"></div>
        </div>

        <div class="auth-brand-bottom">
          <p class="auth-brand-tagline">Grilled fresh. Made for you.</p>
        </div>
      </aside>

      <!-- Right Panel: Registration Form -->
      <main class="auth-form-panel">
        <div class="auth-form-container">
          <div class="auth-form-header">
            <h2 class="auth-form-title">Create an Account</h2>
            <p class="auth-form-subtitle">Join GIGABITE to order quickly and track deliveries</p>
          </div>

          <form id="register-form" class="auth-form">
            <div class="auth-name-row">
              <div class="auth-form-group">
                <label class="auth-form-label" for="reg-first-name">First Name</label>
                <input
                  type="text"
                  id="reg-first-name"
                  class="auth-form-input"
                  required
                  maxlength="50"
                  placeholder="First name"
                  autocomplete="given-name"
                  autofocus
                />
              </div>

              <div class="auth-form-group">
                <label class="auth-form-label" for="reg-last-name">Last Name</label>
                <input
                  type="text"
                  id="reg-last-name"
                  class="auth-form-input"
                  required
                  maxlength="50"
                  placeholder="Last name"
                  autocomplete="family-name"
                />
              </div>
            </div>

            <div class="auth-form-group">
              <label class="auth-form-label" for="reg-email">Email Address</label>
              <input
                type="email"
                id="reg-email"
                class="auth-form-input"
                required
                placeholder="Enter your email address"
                autocomplete="email"
              />
            </div>

            <div class="auth-form-group">
              <label class="auth-form-label" for="reg-password">Password</label>
              <div class="auth-password-wrapper">
                <input
                  type="password"
                  id="reg-password"
                  class="auth-form-input"
                  required
                  placeholder="Create a password"
                  autocomplete="new-password"
                />
                <button
                  type="button"
                  class="toggle-password-btn"
                  data-target="reg-password"
                  aria-label="Toggle password visibility"
                >
                  <i class="fa-solid fa-eye" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <div class="auth-form-group">
              <label class="auth-form-label" for="reg-confirm-password">Confirm Password</label>
              <div class="auth-password-wrapper">
                <input
                  type="password"
                  id="reg-confirm-password"
                  class="auth-form-input"
                  required
                  placeholder="Confirm your password"
                  autocomplete="new-password"
                />
                <button
                  type="button"
                  class="toggle-password-btn"
                  data-target="reg-confirm-password"
                  aria-label="Toggle password visibility"
                >
                  <i class="fa-solid fa-eye" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <button
              type="submit"
              id="register-submit-btn"
              class="auth-submit-button"
            >
              Sign Up
            </button>
          </form>

          <div
            id="verification-result"
            class="hidden"
            role="status"
            aria-live="polite"
          >
            <h2 class="auth-result-title">Check your email</h2>
            <p id="verification-message" class="text-muted"></p>
            <button
              type="button"
              id="resend-verification-btn"
              class="btn btn-secondary"
            >
              Resend verification email
            </button>
            <p
              id="resend-verification-message"
              class="text-muted"
              aria-live="polite"
            ></p>
          </div>

          <div class="auth-divider-line"></div>

          <div class="auth-switch-row">
            Already have an account?
            <a href="login.html" class="auth-switch-link">Sign In</a>
          </div>

          <div class="auth-back-row">
            <a href="index.html" class="auth-back-link">← Go back to Home</a>
          </div>
        </div>
      </main>
    </div>

    <script type="module">
      import { apiFetch } from './js/api.js';
      import { showToast } from './js/ui.js';
      import { isLoggedIn, isAdmin } from './js/auth.js';

      function init() {
        if (isLoggedIn() && isAdmin()) {
          window.location.replace('admin.html');
          return;
        }

        // Password eye toggles
        document.querySelectorAll('.toggle-password-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const target = document.getElementById(
              btn.getAttribute('data-target')
            );
            if (target) {
              const isPassword = target.type === 'password';
              target.type = isPassword ? 'text' : 'password';
              const icon = btn.querySelector('i');
              if (icon) {
                if (isPassword) {
                  icon.classList.remove('fa-eye');
                  icon.classList.add('fa-eye-slash');
                } else {
                  icon.classList.remove('fa-eye-slash');
                  icon.classList.add('fa-eye');
                }
              }
            }
          });
        });

        const form = document.getElementById('register-form');
        const submitBtn = document.getElementById('register-submit-btn');
        const verificationResult = document.getElementById(
          'verification-result'
        );
        const resendButton = document.getElementById(
          'resend-verification-btn'
        );
        const resendMessage = document.getElementById(
          'resend-verification-message'
        );
        let pendingEmail = '';

        function getVerificationServerMessage(error) {
          if (
            error.status === 404 &&
            error.message.includes('Cannot find API endpoint')
          ) {
            return 'Email verification is not enabled on the current server version. Your registration was not submitted. Please try again after the site has been updated.';
          }
          return error.message;
        }

        form.addEventListener('submit', async (e) => {
          e.preventDefault();

          const firstName = document.getElementById('reg-first-name').value.trim();
          const lastName = document.getElementById('reg-last-name').value.trim();
          const email = document.getElementById('reg-email').value.trim();
          const password = document.getElementById('reg-password').value;
          const confirmPassword = document.getElementById(
            'reg-confirm-password'
          ).value;

          if (!firstName) {
            showToast('Please enter your first name.', 'warning');
            return;
          }

          if (!lastName) {
            showToast('Please enter your last name.', 'warning');
            return;
          }

          if (password !== confirmPassword) {
            showToast('Passwords do not match.', 'warning');
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = 'Sending verification email...';

          try {
            const verificationStatus = await apiFetch(
              '/auth/verification-status'
            );
            if (!verificationStatus.verificationEnabled) {
              throw new Error(
                'Email verification is not configured on the server. Your registration was not submitted. Please contact the shop.'
              );
            }

            const res = await apiFetch('/auth/register', {
              method: 'POST',
              body: JSON.stringify({
                firstName,
                lastName,
                email,
                password,
                confirmPassword,
              }),
            });

            pendingEmail = email;
            form.classList.add('hidden');
            verificationResult.classList.remove('hidden');
            document.getElementById('verification-message').textContent =
              `${res.message} (${email})`;
          } catch (err) {
            showToast(getVerificationServerMessage(err), 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign Up';
          }
        });

        resendButton.addEventListener('click', async () => {
          resendButton.disabled = true;
          resendMessage.textContent = 'Sending...';
          try {
            const res = await apiFetch('/auth/resend-verification', {
              method: 'POST',
              body: JSON.stringify({ email: pendingEmail }),
            });
            resendMessage.textContent = res.message;
          } catch (err) {
            resendMessage.textContent = getVerificationServerMessage(err);
          } finally {
            resendButton.disabled = false;
          }
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    </script>
  </body>
</html>
